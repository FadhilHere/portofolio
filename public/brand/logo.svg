<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Fadhil Parmata — F tree mark</title>
  <defs>
    <!-- App tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset="0.55" stop-color="#eef0f7"/>
      <stop offset="1" stop-color="#dcdfec"/>
    </linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c9ccdb" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14122b" flood-opacity="0.28"/>
    </filter>

    <!-- The mark: glossy ink body, indigo-violet underglow -->
    <linearGradient id="body" x1="0" y1="170" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a3756"/>
      <stop offset="0.45" stop-color="#1c1a2e"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="280" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b32f0"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="560" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#6d5dff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="gloss" cx="430" cy="250" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="3"/></filter>

    <!-- A tree drawn as the letter F: the trunk is the stem, the canopy the top bar,
         a branch with its own leaves the middle bar, and the roots its foot. -->
    <g id="tree">
      <!-- canopy: the F's top bar -->
      <circle cx="372" cy="300" r="74"/>
      <circle cx="462" cy="252" r="94"/>
      <circle cx="574" cy="250" r="86"/>
      <circle cx="676" cy="292" r="80"/>
      <rect x="372" y="250" width="304" height="122" rx="40"/>
      <!-- trunk with flared roots: the stem -->
      <path d="M382 330 L478 330 L488 676 C492 724 520 748 568 760 C592 766 592 792 566 794 L302 794 C276 792 276 766 300 760 C348 748 374 724 378 676 Z"/>
      <!-- branch: the F's middle bar, ending in its own leaves -->
      <path d="M470 500 C524 494 566 484 604 470 L620 540 C574 552 528 560 476 568 Z"/>
      <circle cx="628" cy="500" r="64"/>
      <circle cx="574" cy="462" r="40"/>
    </g>
    <clipPath id="treeClip">
      <circle cx="372" cy="300" r="74"/>
      <circle cx="462" cy="252" r="94"/>
      <circle cx="574" cy="250" r="86"/>
      <circle cx="676" cy="292" r="80"/>
      <rect x="372" y="250" width="304" height="122" rx="40"/>
      <path d="M382 330 L478 330 L488 676 C492 724 520 748 568 760 C592 766 592 792 566 794 L302 794 C276 792 276 766 300 760 C348 748 374 724 378 676 Z"/>
      <path d="M470 500 C524 494 566 484 604 470 L620 540 C574 552 528 560 476 568 Z"/>
      <circle cx="628" cy="500" r="64"/>
      <circle cx="574" cy="462" r="40"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="96" y="96" width="832" height="832" rx="210" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="97.5" y="97.5" width="829" height="829" rx="208.5" fill="none" stroke="url(#tileEdge)" stroke-width="3"/>

  <g transform="translate(-14 22)">
  <!-- Soft shadow the mark casts on the tile -->
  <use href="#tree" fill="#1a1830" opacity="0.22" transform="translate(0 34)" filter="url(#soft)"/>
  <!-- Coloured underglow peeking out below the body -->
  <use href="#tree" fill="url(#glow)" transform="translate(0 16)" filter="url(#rim)"/>
  <use href="#tree" fill="url(#glow)" opacity="0.55" transform="translate(0 30)" filter="url(#soft)"/>
  <!-- Body -->
  <use href="#tree" fill="url(#body)"/>
  <!-- Colour reflected up into the lower body, and the top gloss -->
  <g clip-path="url(#treeClip)">
    <rect x="200" y="540" width="640" height="280" fill="url(#reflect)"/>
    <rect x="200" y="150" width="640" height="700" fill="url(#gloss)"/>
    <!-- Thin highlight along the top of the canopy -->
    <path d="M318 268 C360 206 420 172 470 166 C520 160 560 170 590 172 C640 176 700 212 724 252" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round" filter="url(#rim)"/>
    <!-- Specular spots: canopy and trunk catch the light like glazed ceramic -->
    <ellipse cx="420" cy="214" rx="74" ry="30" transform="rotate(-14 420 214)" fill="#ffffff" opacity="0.28" filter="url(#rim)"/>
    <path d="M398 360 C394 460 392 580 390 670" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="14" stroke-linecap="round" filter="url(#rim)"/>
  </g>
  </g>
</svg>
